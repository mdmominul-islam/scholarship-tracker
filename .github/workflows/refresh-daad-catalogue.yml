name: Refresh DAAD Master's catalogue

on:
  push:
    paths:
      - ".github/workflows/refresh-daad-catalogue.yml"
      - "scripts/refresh_daad_catalogue.py"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-daad-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Fetch all DAAD Master's programmes and course details
        run: python scripts/refresh_daad_catalogue.py
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daad-programmes.json
          if git diff --cached --quiet; then
            echo "DAAD catalogue has no changes."
          else
            git commit -m "Refresh DAAD Master's catalogue"
            git push
          fi
